name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validar frontend, API y dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Validar código, catálogos y configuración API
        run: npm run validate

      - name: Auditar dependencias
        run: npm audit --audit-level=high

  codeql:
    name: Analizar seguridad JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript
