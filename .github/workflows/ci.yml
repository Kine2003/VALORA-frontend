name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write
  pages: write
  id-token: write

jobs:
  validate:
    name: Validar frontend, API y dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias exactas
        run: npm ci

      - name: Validar código, catálogos y configuración API
        run: npm run validate

      - name: Probar sesión, formularios y pedidos
        run: npm test

      - name: Auditar dependencias
        run: npm audit --audit-level=high

  codeql:
    name: Analizar seguridad JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript

  deploy:
    name: Publicar en GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, codeql]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto de Pages
        run: |
          mkdir -p .pages
          cat > .pages/index.html <<'HTML'
          <!doctype html>
          <html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="refresh" content="0;url=https://valora-api-9thl.onrender.com/"><link rel="canonical" href="https://valora-api-9thl.onrender.com/"><title>Válora</title></head><body><p>Abriendo Válora… <a href="https://valora-api-9thl.onrender.com/">Entrar a la aplicación</a></p></body></html>
          HTML

      - name: Subir entrada de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
